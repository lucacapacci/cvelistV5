name: Repo Sync
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Chunked Push
        run: |
          # 1. Setup identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000

          # 2. SAVE your sync file
          cp .github/workflows/sync.yml /home/runner/sync.yml_backup

          # 3. Add source and fetch latest
          git remote add source https://github.com/CVEProject/cvelistV5.git
          git fetch source main --depth=1

          # 4. Force the working directory to match the source
          # This makes the 'cves/' folder appear so the loop can see it
          git checkout source/main -- .

          # 5. Clean and Restore Workflows
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /home/runner/sync.yml_backup .github/workflows/sync.yml

          # 6. CHUNKED COMMIT AND PUSH
          # Pushing year-by-year to bypass GitHub's upload limits
          YEARS=$(ls cves/)
          for year in $YEARS; do
            echo "Processing year: $year"
            git add "cves/$year"
            # We use --allow-empty in case a year has no changes
            git commit -m "Sync CVE Data for $year: $(date)" || echo "No changes for $year"
            # Push every 5 years to speed it up while staying safe, 
            # or just push every year for maximum reliability:
            git push origin main
          done

          # 7. Final push for root files (delta.json, etc.)
          git add .
          git commit -m "Finalizing Sync: $(date)" || echo "No extra files"
          git push origin main
