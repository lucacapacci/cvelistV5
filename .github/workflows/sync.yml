- name: Sync
        run: |
          # 1. Setup identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Increase Git limits for large repo handling
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

          # 3. SAVE your sync file
          cp .github/workflows/sync.yml /home/runner/sync.yml_backup

          # 4. Add source and fetch ONLY the latest commit
          git remote add source https://github.com/CVEProject/cvelistV5.git
          git fetch source main --depth=1

          # 5. Overwrite local state
          git reset --hard source/main

          # 6. Clean and Restore Workflows
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /home/runner/sync.yml_backup .github/workflows/sync.yml

          # 7. Push with optimized settings
          git add .
          git commit -m "Sync CVE Data: $(date)" || echo "No changes to sync"
          
          # Use '--thin' to reduce data transfer size
          git push origin main --force --thin
