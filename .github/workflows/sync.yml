name: Repo Sync (Full Chunked)
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Chunked Push
        run: |
          # 1. Setup identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000

          # 2. SAVE your sync file
          cp .github/workflows/sync.yml /home/runner/sync.yml_backup

          # 3. Add source and fetch
          git remote add source https://github.com/CVEProject/cvelistV5.git
          git fetch source main --depth=1

          # 4. Extract ONLY the cves folder from source
          # This avoids pulling their .github/workflows and triggering security blocks
          git checkout source/main -- cves/

          # 5. Clean and Restore YOUR workflow
          # We ensure your sync.yml is the ONLY thing in .github/workflows
          find .github/workflows -type f -not -name 'sync.yml' -delete
          mkdir -p .github/workflows
          cp /home/runner/sync.yml_backup .github/workflows/sync.yml

          # 6. CHUNKED COMMIT AND PUSH
          # Iterate through the years. We use a sort to go in order.
          YEARS=$(ls cves/ | grep -E '^[0-9]{4}$' | sort)
          for year in $YEARS; do
            echo "Processing year: $year"
            git add "cves/$year"
            
            # Only commit and push if there are actual changes for this year
            if git commit -m "Sync CVE Data for $year: $(date)"; then
              echo "Pushing changes for $year..."
              git push origin main
            else
              echo "No changes detected for $year."
            fi
          done

          # 7. Final push for files in cves/ root (like delta.json)
          git add cves/*.json
          git commit -m "Finalizing Sync (Delta Files): $(date)" || echo "No delta changes"
          git push origin main
