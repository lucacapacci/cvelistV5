name: Repo Sync
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Chunked Push
        run: |
          # 1. Setup identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000

          # 2. SAVE your sync file to a safe place
          cp .github/workflows/sync.yml /home/runner/sync.yml_backup

          # 3. Add source and fetch
          git remote add source https://github.com/CVEProject/cvelistV5.git
          git fetch source main --depth=1

          # 4. EXPORT source data to a temporary folder (avoids .github issues)
          mkdir /home/runner/source_data
          git --git-dir=.git checkout source/main -- cves/ delta.json deltaLog.json

          # 5. Completely wipe local repo files (except .git) to ensure a clean sync
          # We leave .github/workflows alone for a second
          find . -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # 6. Move the CVE data into your repo
          cp -r cves/ .
          cp *.json . || echo "No json files in root"

          # 7. Force-restore ONLY your sync.yml
          rm -rf .github/workflows/*
          mkdir -p .github/workflows
          cp /home/runner/sync.yml_backup .github/workflows/sync.yml

          # 8. CHUNKED COMMIT AND PUSH
          # This avoids the "refusing to allow a GitHub App to update workflow" error
          # because we never 'git add' their workflow files.
          YEARS=$(ls cves/)
          for year in $YEARS; do
            echo "Processing year: $year"
            git add "cves/$year"
            if git commit -m "Sync CVE Data for $year: $(date)"; then
              git push origin main
            fi
          done

          # 9. Final push for root JSONs
          git add delta.json deltaLog.json || echo "No root files"
          git commit -m "Finalizing Sync: $(date)" || echo "No extra files"
          git push origin main
