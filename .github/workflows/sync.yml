name: Repo Sync (Full)
on:
  schedule:
    - cron: '0 */2 * * *' # Running every 2 hours as this takes longer
  workflow_dispatch:

jobs:
  sync-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Chunked Push
        run: |
          # 1. Setup identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000

          # 2. SAVE your sync file
          cp .github/workflows/sync.yml /home/runner/sync.yml_backup

          # 3. Add source and fetch
          git remote add source https://github.com/CVEProject/cvelistV5.git
          git fetch source main --depth=1

          # 4. Move to the latest state locally (but don't commit yet)
          git reset --soft source/main

          # 5. Clean and Restore Workflows (so we don't push upstream workflows)
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /home/runner/sync.yml_backup .github/workflows/sync.yml

          # 6. CHUNKED COMMIT AND PUSH
          # We iterate through the years inside the cves/ folder
          # and push them in groups to avoid server timeouts.
          
          YEARS=$(ls cves/)
          for year in $YEARS; do
            echo "Processing year: $year"
            git add "cves/$year"
            # Commit and push each year individually
            if git commit -m "Sync CVE Data for $year: $(date)"; then
              git push origin main
            fi
          done

          # 7. Final push for everything else (root files like delta.json)
          git add .
          git commit -m "Finalizing Sync: $(date)" || echo "No extra files"
          git push origin main
